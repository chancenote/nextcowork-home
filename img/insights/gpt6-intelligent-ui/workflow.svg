<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">질문에서 판단까지 4단계 활용 흐름</title><desc id="desc">목표 정의, 정보 확인, 조건 탐색, 검증과 실행을 연결한 절차</desc><defs><linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6955BA"/><stop offset="1" stop-color="#0095C3"/></linearGradient><linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F6FD"/><stop offset="1" stop-color="#EDF8FB"/></linearGradient><filter id="shadow" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-opacity="0.07"/></filter></defs><rect width="1200" height="630" fill="url(#canvas)"/><text x="55" y="81" font-size="38" font-family="'Noto Sans CJK KR', 'NanumSquare', Arial, sans-serif" font-weight="700" fill="#172554" text-anchor="start">질문에서 판단까지, 4단계 사용 흐름</text><text x="55" y="118" font-size="20" font-family="'Noto Sans CJK KR', 'NanumSquare', Arial, sans-serif" font-weight="500" fill="#667085" text-anchor="start">예쁜 화면보다 중요한 것은 검증 가능한 의사결정입니다.</text><rect x="55" y="182" width="260" height="300" rx="23" fill="#FFFFFF" stroke="#E2E6EF" stroke-width="1"/><rect x="78" y="208" width="58" height="49" rx="13" fill="#6955BA" stroke="none" stroke-width="1"/><text x="107" y="242" font-size="24" font-family="'Noto Sans CJK KR', 'NanumSquare', Arial, sans-serif" font-weight="700" fill="white" text-anchor="middle">01</text><text x="78" y="308" font-size="27" font-family="'Noto Sans CJK KR', 'NanumSquare', Arial, sans-serif" font-weight="700" fill="#1F2937" text-anchor="start">목표 정의</text><text x="78" y="356" font-size="19" font-family="'Noto Sans CJK KR', 'NanumSquare', Arial, sans-serif" font-weight="500" fill="#475467" text-anchor="start">무엇을 결정할까?</text><rect x="77" y="410" width="215" height="39" rx="10" fill="#F4F5FA" stroke="none" stroke-width="1"/><text x="184" y="436" font-size="15" font-family="'Noto Sans CJK KR', 'NanumSquare', Arial, sans-serif" font-weight="500" fill="#667085" text-anchor="middle">대상 · 목적 · 제약</text><circle cx="328" cy="334" r="18" fill="#F2F0FA"/><text x="328" y="343" font-size="29" font-family="'Noto Sans CJK KR', 'NanumSquare', Arial, sans-serif" font-weight="700" fill="#6955BA" text-anchor="middle">›</text><rect x="342" y="182" width="260" height="300" rx="23" fill="#FFFFFF" stroke="#E2E6EF" stroke-width="1"/><rect x="365" y="208" width="58" height="49" rx="13" fill="#0095C3" stroke="none" stroke-width="1"/><text x="394" y="242" font-size="24" font-family="'Noto Sans CJK KR', 'NanumSquare', Arial, sans-serif" font-weight="700" fill="white" text-anchor="middle">02</text><text x="365" y="308" font-size="27" font-family="'Noto Sans CJK KR', 'NanumSquare', Arial, sans-serif" font-weight="700" fill="#1F2937" text-anchor="start">정보 확인</text><text x="365" y="356" font-size="19" font-family="'Noto Sans CJK KR', 'NanumSquare', Arial, sans-serif" font-weight="500" fill="#475467" text-anchor="start">무엇을 근거로 할까?</text><rect x="364" y="410" width="215" height="39" rx="10" fill="#F4F5FA" stroke="none" stroke-width="1"/><text x="471" y="436" font-size="15" font-family="'Noto Sans CJK KR', 'NanumSquare', Arial, sans-serif" font-weight="500" fill="#667085" text-anchor="middle">자료 · 출처 · 가정</text><circle cx="615" cy="334" r="18" fill="#F2F0FA"/><text x="615" y="343" font-size="29" font-family="'Noto Sans CJK KR', 'NanumSquare', Arial, sans-serif" font-weight="700" fill="#6955BA" text-anchor="middle">›</text><rect x="629" y="182" width="260" height="300" rx="23" fill="#FFFFFF" stroke="#E2E6EF" stroke-width="1"/><rect x="652" y="208" width="58" height="49" rx="13" fill="#25AFA5" stroke="none" stroke-width="1"/><text x="681" y="242" font-size="24" font-family="'Noto Sans CJK KR', 'NanumSquare', Arial, sans-serif" font-weight="700" fill="white" text-anchor="middle">03</text><text x="652" y="308" font-size="27" font-family="'Noto Sans CJK KR', 'NanumSquare', Arial, sans-serif" font