<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Intelligent UI 네 가지 인터페이스 유형</title><desc id="desc">비교, 구조 이해, 시뮬레이션, 실행 관리의 대표 화면 예시</desc><defs><linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6955BA"/><stop offset="1" stop-color="#0095C3"/></linearGradient><linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F6FD"/><stop offset="1" stop-color="#EDF8FB"/></linearGradient><filter id="shadow" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-opacity="0.07"/></filter></defs><rect width="1200" height="630" fill="url(#canvas)"/><text x="55" y="80" font-size="38" font-family="'Noto Sans CJK KR', 'NanumSquare', Arial, sans-serif" font-weight="700" fill="#172554" text-anchor="start">Intelligent UI를 이해하는 4가지 화면</text><text x="55" y="115" font-size="20" font-family="'Noto Sans CJK KR', 'NanumSquare', Arial, sans-serif" font-weight="500" fill="#667085" text-anchor="start">문제의 종류에 따라 적합한 인터페이스가 달라집니다.</text><rect x="55" y="149" width="514" height="210" rx="21" fill="#FFFFFF" stroke="#E2E6EF" stroke-width="1"/><circle cx="98" cy="192" r="22" fill="#6955BA"/><text x="135" y="197" font-size="25" font-family="'Noto Sans CJK KR', 'NanumSquare', Arial, sans-serif" font-weight="700" fill="#25314B" text-anchor="start">01 비교</text><text x="135" y="231" font-size="17" font-family="'Noto Sans CJK KR', 'NanumSquare', Arial, sans-serif" font-weight="500" fill="#667085" text-anchor="start">대안을 한눈에</text><rect x="631" y="149" width="514" height="210" rx="21" fill="#FFFFFF" stroke="#E2E6EF" stroke-width="1"/><circle cx="674" cy="192" r="22" fill="#0095C3"/><text x="711" y="197" font-size="25" font-family="'Noto Sans CJK KR', 'NanumSquare', Arial, sans-serif" font-weight="700" fill="#25314B" text-anchor="start">02 구조 이해</text><text x="711" y="231" font-size="17" font-family="'Noto Sans CJK KR', 'NanumSquare', Arial, sans-serif" font-weight="500" fill="#667085" text-anchor="start">관계를 직관적으로</text><rect x="55" y="383" width="514" height="210" rx="21" fill="#FFFFFF" stroke="#E2E6EF" stroke-width="1"/><circle cx="98" cy="426" r="22" fill="#25AFA5"/><text x="135" y="431" font-size="25" font-family="'Noto Sans CJK KR', 'NanumSquare', Arial, sans-serif" font-weight="700" fill="#25314B" text-anchor="start">03 시뮬레이션</text><text x="135" y="465" font-size="17" font-family="'Noto Sans CJK KR', 'NanumSquare', Arial, sans-serif" font-weight="500" fill="#667085" text-anchor="start">변수를 직접 변경</text><rect x="631" y="383" width="514" height="210" rx="21" fill="#FFFFFF" stroke="#E2E6EF" stroke-width="1"/><circle cx="674" cy="426" r="22" fill="#6955BA"/><text x="711" y="431" font-size="25" font-family="'Noto Sans CJK KR', 'NanumSquare', Arial, sans-serif" font-weight="700" fill="#25314B" text-anchor="start">04 실행 관리</text><text x="711" y="465" font-size="17" font-family="'Noto Sans CJK KR', 'NanumSquare', Arial, sans-serif" font-weight="500" fill="#667085" text-anchor="start">단계별 완료 확인</text><text x="89" y="253" font-size="15" font-family="'Noto Sans CJK KR', 'NanumSquare', Arial, sans-serif" font-weight="600" fill="#475467" text-anchor="start">항목 A</text><text x="261" y="253" font-size="15" font-family="'Noto Sans CJK KR', 'NanumSquare', Arial, sans-serif" font-weight="600" fill="#6955BA" text-anchor="start">A안 / B안</text><line x1="85" y1="262" x2="535" y2="262" stroke="#ECEDF3" stroke-width="1" stroke-linecap="round"/><text x="89" y="281" font-size="15" font-family="'Noto Sans CJK KR', 'NanumSquare', Arial, sans-serif" font-weight="600" fill="#475467" text-anchor="start">비용</text><text x="261" y="281" font-size="15" font-family="'Noto Sans CJK KR', 'NanumSquare', Arial, sans-serif" font-weight="600" fill="#6955BA" text-anchor="start">낮음 / 높음</text><line x1="85" y1="290" x2="535" y2="290" stroke="#ECEDF3" stroke-width="1" stroke-linecap="round"/><text x="89" y