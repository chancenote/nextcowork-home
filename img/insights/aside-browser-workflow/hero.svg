<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">탭의 홍수에서 하나의 업무 흐름으로</title><desc id="desc">흩어진 여러 탭이 왼쪽에 있고, 오른쪽에는 자료와 결과물을 나란히 둔 하나의 작업 화면이 있는 개념 일러스트입니다. 실제 제품 화면이 아닙니다.</desc>
<rect width="1200" height="630" fill="#F8F0FF"/>
<g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif">
<text x="60" y="96" fill="#302D7C" font-size="48" font-weight="700">탭의 홍수에서 업무 흐름으로</text>
<text x="62" y="140" fill="#545659" font-size="24">자료는 곁에 두고, 결과물은 하나로 정합니다.</text>
<g stroke="#B99EFF" stroke-width="2" fill="#fff">
<g transform="translate(70 215) rotate(-6)"><rect width="170" height="46" rx="12"/><circle cx="26" cy="23" r="7" fill="#B99EFF" stroke="none"/><text x="46" y="30" fill="#302D7C" stroke="none" font-size="20">자료 A</text></g>
<g transform="translate(270 190) rotate(4)"><rect width="170" height="46" rx="12"/><circle cx="26" cy="23" r="7" fill="#7950E8" stroke="none"/><text x="46" y="30" fill="#302D7C" stroke="none" font-size="20">비교표</text></g>
<g transform="translate(110 285) rotate(3)"><rect width="170" height="46" rx="12"/><circle cx="26" cy="23" r="7" fill="#00AEB7" stroke="none"/><text x="46" y="30" fill="#302D7C" stroke="none" font-size="20">회의 메모</text></g>
<g transform="translate(305 270) rotate(-5)"><rect width="170" height="46" rx="12"/><circle cx="26" cy="23" r="7" fill="#B99EFF" stroke="none"/><text x="46" y="30" fill="#302D7C" stroke="none" font-size="20">자료 B</text></g>
<g transform="translate(60 360) rotate(-3)"><rect width="170" height="46" rx="12"/><circle cx="26" cy="23" r="7" fill="#7950E8" stroke="none"/><text x="46" y="30" fill="#302D7C" stroke="none" font-size="20">초안</text></g>
<g transform="translate(260 355) rotate(6)"><rect width="170" height="46" rx="12"/><circle cx="26" cy="23" r="7" fill="#00AEB7" stroke="none"/><text x="46" y="30" fill="#302D7C" stroke="none" font-size="20">참고 링크</text></g>
<g transform="translate(150 435) rotate(-4)"><rect width="170" height="46" rx="12"/><circle cx="26" cy="23" r="7" fill="#B99EFF" stroke="none"/><text x="46" y="30" fill="#302D7C" stroke="none" font-size="20">자료 C</text></g>
<g transform="translate(335 440) rotate(3)"><rect width="140" height="46" rx="12"/><circle cx="26" cy="23" r="7" fill="#7950E8" stroke="none"/><text x="46" y="30" fill="#302D7C" stroke="none" font-size="20">메일</text></g>
</g>
<text x="70" y="545" fill="#545659" font-size="22">찾고, 옮기고, 다시 설명하던 순간</text>
<path d="M505 330 H625" stroke="#7950E8" stroke-width="6" stroke-linecap="round"/>
<path d="M600 303 L630 330 L600 357" fill="none" stroke="#7950E8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="660" y="190" width="480" height="330" rx="22" fill="#fff" stroke="#302D7C" stroke-width="3"/>
<path d="M660 240 H1140" stroke="#E4D7FA" stroke-width="2"/>
<circle cx="690" cy="215" r="6" fill="#B99EFF"/><circle cx="712" cy="215" r="6" fill="#B99EFF"/><circle cx="734" cy="215" r="6" fill="#B99EFF"/>
<path d="M900 240 V470" stroke="#E4D7FA" stroke-width="2"/>
<text x="684" y="276" fill="#7950E8" font-size="20" font-weight="700">자료</text>
<rect x="684" y="294" width="190" height="12" rx="6" fill="#E4D7FA"/><rect x="684" y="320" width="160" height="12" rx="6" fill="#E4D7FA"/><rect x="684" y="346" width="190" height="12" rx="6" fill="#E4D7FA"/><rect x="684" y="372" width="120" height="12" rx="6" fill="#E4D7FA"/><rect x="684" y="398" width="175" height="12" rx="6" fill="#E4D7FA"/>
<text x="924" y="276" fill="#00AEB7" font-size="20" font-weight="700">결과물</text>
<rect x="924" y="296" width="190" height="34" rx="6" fill="#302D7C"/><rect x="924" y="334" width="190" height="30" rx="4" fill="#F8F0FF" stroke="#B99EFF" stroke-width="1.5"/><rect x="924" y="368" width="190" height="30" rx="4" fill="#F8F0FF" stroke="#B99EFF" stroke-width="1.5"/><rect x="924" y="402" width="190" height="30" rx="4" fill="#F8F0FF" stroke="#B99EFF" stroke-width="1.5"/>
<path d="M661.5 470 H1138.5 V498 a20 20 0 0 1 -20 20 H681.5 a20 20 0 0 1 -20 -20 Z" fill="#F8F0FF"/>
<path d="M660 470 H1140" stroke="#E4D7FA" stroke-width="2"/>
<text x="684" y="502" fill="#302D7C" font-size="20" font-weight="700">확인 후 멈춤 · 원문 링크 남기기</text>
<text x="660" y="565" fill="#302D7C" font-size="22" font-weight="700">하나의 결과물</text>
</g>
<text x="60" y="600" fill="#545659" font-size="18" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif">넥스트코웍 개념 일러스트 · 실제 제품 화면이 아닙니다.</text>
</svg>
