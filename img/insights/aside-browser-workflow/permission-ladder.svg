<svg xmlns="http://www.w3.org/2000/svg" width="800" height="960" viewBox="0 0 800 960" role="img" aria-labelledby="title desc">
<title id="title">작업 권한은 좁은 것부터 시작합니다</title><desc id="desc">Read only는 파일을 바꾸지 않고 살펴보기만 하고, Guard는 승인된 폴더에서 작업하며 다른 폴더는 묻고, Full access는 컴퓨터 어디서든 읽고 쓸 수 있습니다. Guard가 새 작업의 기본값입니다.</desc>
<rect width="800" height="960" fill="#F8F0FF"/>
<g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif">
<text x="40" y="76" fill="#302D7C" font-size="42" font-weight="700">작업 권한은 좁은 것부터</text><text x="40" y="120" fill="#545659" font-size="26">맡길 일에 맞춰 한 칸씩 넓혀가세요.</text><rect x="32" y="156" width="736" height="196" rx="22" fill="#fff"/><rect x="32" y="156" width="12" height="196" rx="6" fill="#00AEB7"/><text x="68" y="196" fill="#302D7C" font-size="24" font-weight="700">1단계 · 가장 좁음</text><text x="68" y="244" fill="#302D7C" font-size="40" font-weight="700">Read only</text><text x="68" y="288" fill="#302D7C" font-size="28" font-weight="600">파일을 바꾸지 않고 살펴보기만</text><text x="68" y="326" fill="#545659" font-size="26">이럴 때: 공개 자료를 읽고 비교할 때</text><rect x="32" y="372" width="736" height="196" rx="22" fill="#fff" stroke="#7950E8" stroke-width="3"/><rect x="32" y="372" width="12" height="196" rx="6" fill="#7950E8"/><text x="68" y="412" fill="#7950E8" font-size="24" font-weight="700">2단계 · 새 작업의 기본값</text><text x="68" y="460" fill="#302D7C" font-size="40" font-weight="700">Guard</text><text x="68" y="504" fill="#302D7C" font-size="28" font-weight="600">승인된 폴더에서 작업, 다른 폴더는 질문</text><text x="68" y="542" fill="#545659" font-size="26">이럴 때: 정해둔 폴더에 초안을 만들 때</text><rect x="32" y="588" width="736" height="196" rx="22" fill="#fff"/><rect x="32" y="588" width="12" height="196" rx="6" fill="#302D7C"/><text x="68" y="628" fill="#302D7C" font-size="24" font-weight="700">3단계 · 가장 넓음</text><text x="68" y="676" fill="#302D7C" font-size="40" font-weight="700">Full access</text><text x="68" y="720" fill="#302D7C" font-size="28" font-weight="600">컴퓨터 어디서든 읽고 쓰기</text><text x="68" y="758" fill="#545659" font-size="26">이럴 때: 범위와 대상이 분명할 때만</text><text x="40" y="838" fill="#302D7C" font-size="26" font-weight="600">도구별 허용·질문·차단 규칙은 따로 정해요.</text><text x="40" y="874" fill="#302D7C" font-size="26" font-weight="600">차단이 허용보다 우선합니다.</text><text x="40" y="926" fill="#545659" font-size="24">넥스트코웍 작성 도식 · Aside 공식 권한 안내 기준</text>
</g></svg>
