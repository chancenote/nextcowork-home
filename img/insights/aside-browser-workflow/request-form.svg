<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1020" viewBox="0 0 800 1020" role="img" aria-labelledby="title desc">
<title id="title">첫 요청에 넣을 여섯 가지</title><desc id="desc">목적, 참고 자료, 원하는 결과물, 확인 방식, 작업 범위, 완료 기준 순서로 적습니다. 작업 범위에서 신청·발송·게시 전에 멈추도록 정합니다.</desc>
<rect width="800" height="1020" fill="#F8F0FF"/>
<g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif">
<text x="40" y="76" fill="#302D7C" font-size="42" font-weight="700">첫 요청에 넣을 여섯 가지</text><text x="40" y="120" fill="#545659" font-size="26">위에서 아래로 한 줄씩 채우세요.</text><rect x="32" y="156" width="736" height="118" rx="22" fill="#fff"/><circle cx="92" cy="215" r="28" fill="#fff" stroke="#7950E8" stroke-width="3"/><text x="92" y="224" text-anchor="middle" fill="#7950E8" font-size="26" font-weight="800">1</text><text x="146" y="206" fill="#302D7C" font-size="34" font-weight="700">목적</text><text x="146" y="248" fill="#545659" font-size="26">이 자료로 어떤 판단을 하려는지</text><rect x="32" y="290" width="736" height="118" rx="22" fill="#fff"/><circle cx="92" cy="349" r="28" fill="#fff" stroke="#7950E8" stroke-width="3"/><text x="92" y="358" text-anchor="middle" fill="#7950E8" font-size="26" font-weight="800">2</text><text x="146" y="340" fill="#302D7C" font-size="34" font-weight="700">참고 자료</text><text x="146" y="382" fill="#545659" font-size="26">읽을 페이지·문서의 이름과 위치</text><rect x="32" y="424" width="736" height="118" rx="22" fill="#fff"/><circle cx="92" cy="483" r="28" fill="#fff" stroke="#7950E8" stroke-width="3"/><text x="92" y="492" text-anchor="middle" fill="#7950E8" font-size="26" font-weight="800">3</text><text x="146" y="474" fill="#302D7C" font-size="34" font-weight="700">원하는 결과물</text><text x="146" y="516" fill="#545659" font-size="26">표·회의 메모·비교 문서 중 형태</text><rect x="32" y="558" width="736" height="118" rx="22" fill="#fff"/><circle cx="92" cy="617" r="28" fill="#fff" stroke="#7950E8" stroke-width="3"/><text x="92" y="626" text-anchor="middle" fill="#7950E8" font-size="26" font-weight="800">4</text><text x="146" y="608" fill="#302D7C" font-size="34" font-weight="700">확인 방식</text><text x="146" y="650" fill="#545659" font-size="26">항목마다 원문 링크, 없으면 확인 필요</text><rect x="32" y="692" width="736" height="118" rx="22" fill="#fff" stroke="#00AEB7" stroke-width="3"/><circle cx="92" cy="751" r="28" fill="#00AEB7" stroke="#00AEB7" stroke-width="3"/><text x="92" y="760" text-anchor="middle" fill="#fff" font-size="26" font-weight="800">5</text><text x="146" y="742" fill="#302D7C" font-size="34" font-weight="700">작업 범위</text><text x="146" y="784" fill="#545659" font-size="26">지정한 자료만, 신청·발송·게시 전 멈춤</text><rect x="590" y="706" width="160" height="38" rx="19" fill="#00AEB7"/><text x="670" y="732" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">여기서 멈춤</text><rect x="32" y="826" width="736" height="118" rx="22" fill="#fff"/><circle cx="92" cy="885" r="28" fill="#fff" stroke="#7950E8" stroke-width="3"/><text x="92" y="894" text-anchor="middle" fill="#7950E8" font-size="26" font-weight="800">6</text><text x="146" y="876" fill="#302D7C" font-size="34" font-weight="700">완료 기준</text><text x="146" y="918" fill="#545659" font-size="26">결과물·사용한 자료·남은 확인 사항</text><text x="40" y="990" fill="#545659" font-size="24">넥스트코웍 작성 도식 · 본문 요청 양식과 같은 순서예요.</text>
</g></svg>
