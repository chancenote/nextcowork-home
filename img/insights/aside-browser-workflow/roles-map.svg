<svg xmlns="http://www.w3.org/2000/svg" width="800" height="890" viewBox="0 0 800 890" role="img" aria-labelledby="title desc">
<title id="title">사이드바, 사이드 패널, 화면 분할은 역할이 다릅니다</title><desc id="desc">사이드바는 화면 옆에서 이동을 돕는 영역, 사이드 패널은 보고 있는 페이지를 AI 작업의 맥락으로 첨부하는 곳, 화면 분할은 두 페이지를 나란히 보는 기능입니다.</desc>
<rect width="800" height="890" fill="#F8F0FF"/>
<g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif">
<text x="40" y="76" fill="#302D7C" font-size="42" font-weight="700">이름이 비슷한 세 가지,</text><text x="40" y="128" fill="#302D7C" font-size="42" font-weight="700">역할은 다릅니다</text><rect x="32" y="168" width="736" height="196" rx="22" fill="#fff"/><rect x="32" y="168" width="12" height="196" rx="6" fill="#302D7C"/><text x="68" y="208" fill="#302D7C" font-size="24" font-weight="700">01 · 이동</text><text x="68" y="256" fill="#302D7C" font-size="40" font-weight="700">사이드바</text><text x="68" y="300" fill="#302D7C" font-size="28" font-weight="600">필요한 곳으로 이동하는 화면 옆 영역</text><text x="68" y="338" fill="#545659" font-size="26">여닫는 단축키: Cmd/Ctrl+S</text><rect x="32" y="384" width="736" height="196" rx="22" fill="#fff"/><rect x="32" y="384" width="12" height="196" rx="6" fill="#7950E8"/><text x="68" y="424" fill="#7950E8" font-size="24" font-weight="700">02 · AI에게 맥락 전달</text><text x="68" y="472" fill="#302D7C" font-size="40" font-weight="700">사이드 패널</text><text x="68" y="516" fill="#302D7C" font-size="28" font-weight="600">보고 있는 페이지를 작업에 첨부</text><text x="68" y="554" fill="#545659" font-size="26">제목·호스트명 표시, 빼면 맥락 없이 시작</text><rect x="32" y="600" width="736" height="196" rx="22" fill="#fff"/><rect x="32" y="600" width="12" height="196" rx="6" fill="#00AEB7"/><text x="68" y="640" fill="#302D7C" font-size="24" font-weight="700">03 · 나란히 보기</text><text x="68" y="688" fill="#302D7C" font-size="40" font-weight="700">화면 분할</text><text x="68" y="732" fill="#302D7C" font-size="28" font-weight="600">두 페이지를 한 화면에서 함께 보기</text><text x="68" y="770" fill="#545659" font-size="26">단축키: Cmd/Ctrl+Shift+\</text><text x="40" y="850" fill="#545659" font-size="24">넥스트코웍 작성 도식 · 공식 도움말과 저자 경험을 구분했어요.</text>
</g></svg>
