<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">넥스트코웍의 여정: 공간을 짓고, 열고, 성장을 돕고, 방법을 찾다</title>
<desc id="d">왼쪽에서 오른쪽으로 이어지는 네 단계 카드. 2006–2014 BUILD 공간을 짓다(개발사업 PM, 누계 5,100억), 2015–2023 OPERATE 공간을 열다(공유오피스 4개 지점, 고객사 1,000+), 2018–현재 SCALE UP 성장을 돕다(㈜리슬 고문·사외이사, AI 전환 자문), 2023–현재 THINK UP 방법을 찾다(넥스트코웍 설립, 공간과 AI 교육). 네 카드 아래로 하나의 띠가 이어져 Build the Next Workspace로 모인다.</desc>
