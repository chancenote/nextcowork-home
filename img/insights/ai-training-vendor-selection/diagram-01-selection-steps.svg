<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">AI 교육 업체 선정 3단계: 비교표 채우기, 빈칸을 질문으로, 선정 사유 보고</title>
<desc id="d">왼쪽에서 오른쪽으로 이어지는 세 단계 카드. 1단계 비교표 채우기는 제안서 2~3곳을 같은 12항목 표에 옮긴다. 2단계 빈칸 = 질문은 표에 남은 빈칸을 미팅 질문 스크립트로 확인한다. 3단계 선정 사유 보고는 표의 항목 이름을 그대로 품의에 적는다. 각 카드의 작은 표 그림에서 2단계는 빈칸 하나가 물음표로, 3단계는 항목 이름 열이 강조되어 있다.</desc>
<defs><marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#302D7C"/></marker></defs>
