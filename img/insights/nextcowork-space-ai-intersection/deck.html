<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>넥스트코웍 회사소개서 2026 넘겨보기</title>
<link rel="canonical" href="https://www.nextcw.com/insights/nextcowork-space-ai-intersection/">
<style>
  :root{--ink:#302D7C;--night:#1D1B4A;--web:#7950E8;--paper:#F8F0FF;--body:#545659;--line:#E3C5FF}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--night);color:#fff;font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;display:flex;flex-direction:column;word-break:keep-all}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
  header a.back{color:#d9d3ff;text-decoration:none;font-size:14px}
  header .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .btn{display:inline-block;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap}
  .btn.pri{background:var(--web);color:#fff}
  .btn.sec{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;min-height:0}
  figure{width:100%;max-width:1280px}
  figure img{display:block;width:100%;height:auto;max-height:calc(100vh - 170px);object-fit:contain;border-radius:8px;background:#fff;box-shadow:0 18px 40px rgba(0,0,0,.4)}
  nav{display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 16px 18px}
  nav button{background:#fff;color:var(--ink);border:0;border-radius:999px;width:46px;height:46px;font-size:22px;font-weight:800;cursor:pointer}
  nav button:disabled{opacity:.35;cursor:default}
  nav button:focus-visible,.btn:focus-visible{outline:3px solid var(--line);outline-offset:2px}
  #count{min-width:70px;text-align:center;font-variant-numeric:tabular-nums;color:#d9d3ff}
  .hint{text-align:center;font-size:12px;color:#a9a3d6;padding-bottom:12px}
  @media (max-width:560px){header .back{display:none}header{justify-content:center}}
</style>
</head>
<body>
<header>
  <a class="back" href="/insights/nextcowork-space-ai-intersection/">← 글로 돌아가기</a>
  <div class="acts">
    <a class="btn sec" href="/files/nextcowork-company-profile-2026.pdf" download>PDF 받기</a>
    <a class="btn pri" href="/contact/?s=general&amp;t=diagnosis&amp;cta=deck_company_profile">무료 사전진단 신청</a>
  </div>
</header>
<main>
  <figure>
    <img id="slide" src="deck/slide-01.webp" width="1600" height="900" alt="넥스트코웍 회사소개서 1쪽">
  </figure>
</main>
<nav aria-label="쪽 넘기기">
  <button id="prev" type="button" aria-label="이전 쪽">‹</button>
  <span id="count" aria-live="polite">1 / 24</span>
  <button id="next" type="button" aria-label="다음 쪽">›</button>
</nav>
<p class="hint">← → 키 또는 좌우로 밀어서 넘길 수 있습니다 · 휴대폰은 가로로 보시면 더 크게 보입니다</p>
<script src="deck.js"></script>
</body>
</html>
